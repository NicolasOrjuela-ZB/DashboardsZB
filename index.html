<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboards ZB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#F2F3EF;
  --tarjeta:#FFFFFF;
  --tinta:#16211C;
  --tinta-suave:#5A6660;
  --linea:#DCE0D8;
  --ok:#2E7D4F;
  --atrasado:#C28A1E;
  --caido:#B23A2F;
  --desconocido:#9AA39C;
  --radio:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--papel);
  color:var(--tinta);
  font-family:'Archivo',system-ui,-apple-system,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font:inherit;color:inherit}
a{color:inherit}

/* ---------- Ingreso ---------- */
#ingreso{
  min-height:100vh;display:grid;place-items:center;padding:24px;
}
.caja{width:100%;max-width:340px}
.caja h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.caja p{color:var(--tinta-suave);margin-bottom:28px}
.campo{
  width:100%;padding:11px 13px;border:1px solid var(--linea);
  background:var(--tarjeta);border-radius:var(--radio);margin-bottom:10px;
}
.campo:focus{outline:2px solid var(--tinta);outline-offset:-1px}
.principal{
  width:100%;padding:11px;background:var(--tinta);color:var(--papel);
  border-radius:var(--radio);font-weight:600;margin-top:6px;
}
.principal:disabled{opacity:.45;cursor:default}
.error{color:var(--caido);margin-top:12px;font-size:14px}

/* ---------- Estructura ---------- */
#app{display:none;min-height:100vh;grid-template-columns:212px 1fr}
@media(max-width:820px){#app{grid-template-columns:1fr}}

#rail{
  border-right:1px solid var(--linea);padding:22px 0;
  display:flex;flex-direction:column;
}
@media(max-width:820px){
  #rail{border-right:none;border-bottom:1px solid var(--linea);padding:16px 0 0}
}
.marca{font-weight:700;letter-spacing:-.02em;padding:0 20px 22px}
.contextos{display:flex;flex-direction:column}
@media(max-width:820px){
  .contextos{flex-direction:row;overflow-x:auto;padding:0 12px 12px;gap:6px}
}
.ctx{
  text-align:left;padding:8px 20px;color:var(--tinta-suave);
  border-left:2px solid transparent;white-space:nowrap;
}
@media(max-width:820px){
  .ctx{border-left:none;padding:6px 12px;border:1px solid var(--linea);border-radius:var(--radio)}
}
.ctx:hover{color:var(--tinta)}
.ctx[aria-current="true"]{color:var(--tinta);font-weight:600;border-left-color:var(--tinta)}
@media(max-width:820px){
  .ctx[aria-current="true"]{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
}
.ctx .cuenta{color:var(--tinta-suave);font-weight:400;font-size:13px;margin-left:6px}
.pie{margin-top:auto;padding:20px;font-size:13px;color:var(--tinta-suave)}
.pie button{text-decoration:underline;margin-top:4px}
.idiomas{display:flex;gap:6px;margin:8px 0 2px}
.idiomas button{
  padding:2px 8px;border:1px solid var(--linea);border-radius:99px;
  font-size:12px;color:var(--tinta-suave);background:var(--tarjeta);
}
.idiomas button[aria-pressed="true"]{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}

#panel{padding:26px 30px 60px;max-width:none}
#catalogo{max-width:1180px}
@media(max-width:820px){#panel{padding:20px 16px 48px}}

/* ---------- Búsqueda ---------- */
.barra{display:flex;gap:8px;margin-bottom:14px}
.barra input{
  flex:1;padding:11px 13px;border:1px solid var(--linea);
  background:var(--tarjeta);border-radius:var(--radio);
}
.barra input:focus{outline:2px solid var(--tinta);outline-offset:-1px}
.barra button{
  padding:11px 16px;background:var(--tinta);color:var(--papel);
  border-radius:var(--radio);font-weight:600;
}
.etiquetas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.etiqueta{
  padding:4px 10px;border:1px solid var(--linea);border-radius:99px;
  font-size:13px;color:var(--tinta-suave);background:var(--tarjeta);
}
.etiqueta[aria-pressed="true"]{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}

.respuesta{
  border-left:2px solid var(--tinta);padding:2px 0 2px 14px;
  margin-bottom:20px;max-width:68ch;
}
.respuesta.pensando{border-left-color:var(--linea);color:var(--tinta-suave)}
.respuesta button{font-weight:600;text-decoration:underline;margin-left:8px}

/* ---------- Tarjetas ---------- */
.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.tarjeta{
  display:flex;text-align:left;background:var(--tarjeta);
  border:1px solid var(--linea);border-radius:var(--radio);overflow:hidden;
  width:100%;
}
.tarjeta:hover{border-color:var(--tinta)}
.tarjeta:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
/* El único color saturado de la interfaz: el estado de frescura,
   de alto completo, para poder barrer la grilla sin leer. */
.pulso{width:5px;flex:none}
.pulso.ok{background:var(--ok)}
.pulso.atrasado{background:var(--atrasado)}
.pulso.caido{background:var(--caido)}
.pulso.desconocido{background:var(--desconocido)}
.cuerpo{padding:14px 16px 13px;flex:1;min-width:0}
.titulo{font-weight:600;letter-spacing:-.01em;margin-bottom:5px}
.responde{color:var(--tinta-suave);font-size:14px;line-height:1.45}
.meta{
  display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;
  margin-top:11px;font-size:13px;color:var(--tinta-suave);
}
.estado{font-weight:600}
.estado.ok{color:var(--ok)}
.estado.atrasado{color:var(--atrasado)}
.estado.caido{color:var(--caido)}
.estado.desconocido{color:var(--desconocido)}
.tag{padding:2px 7px;border:1px solid var(--linea);border-radius:99px;font-size:12px}
.tarjeta.sin-acceso .titulo,
.tarjeta.sin-acceso .responde{opacity:.5}
.pedir{
  margin-top:10px;font-size:13px;font-weight:600;text-decoration:underline;
}
.vacio{
  border:1px dashed var(--linea);border-radius:var(--radio);
  padding:28px;color:var(--tinta-suave);
}
.vacio strong{display:block;color:var(--tinta);margin-bottom:5px}

/* ---------- Alta ---------- */
#alta{display:none;max-width:720px}
#alta h1{font-size:22px;letter-spacing:-.02em;margin-bottom:6px}
#alta .intro{color:var(--tinta-suave);margin-bottom:26px;max-width:58ch}
.fila{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.f{flex:1;min-width:190px;display:flex;flex-direction:column}
.f.ancho{flex-basis:100%}
.f label{font-size:13px;color:var(--tinta-suave);margin-bottom:4px}
.f input,.f select,.f textarea{
  padding:9px 11px;border:1px solid var(--linea);background:var(--tarjeta);
  border-radius:var(--radio);font:inherit;color:inherit;width:100%;
}
.f textarea{resize:vertical;min-height:88px;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--tinta);outline-offset:-1px}
.f .pista{font-size:13px;color:var(--tinta-suave);margin-top:4px}
.f .pista.corto{color:var(--caido)}
.selector{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0}
.selector .op{
  padding:5px 11px;border:1px solid var(--linea);border-radius:99px;
  font-size:14px;color:var(--tinta-suave);background:var(--tarjeta);
}
.selector .op[aria-pressed="true"]{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.selector .nueva{color:var(--tinta);border-style:dashed;font-weight:600}
.acciones{display:flex;gap:10px;align-items:center;margin-top:8px}
.acciones .principal{width:auto;padding:10px 20px;margin:0}
.acciones .cancelar{text-decoration:underline;color:var(--tinta-suave)}
.cargar{
  margin:0 20px 18px;padding:8px 0;text-align:left;
  font-weight:600;text-decoration:underline;
}

/* ---------- Huecos ---------- */
#huecos{display:none;max-width:720px}
#huecos h1{font-size:22px;letter-spacing:-.02em;margin-bottom:6px}
#huecos .intro{color:var(--tinta-suave);margin-bottom:22px;max-width:58ch}
.resumen{
  display:flex;gap:36px;flex-wrap:wrap;
  padding:16px 0 20px;border-bottom:1px solid var(--linea);margin-bottom:6px;
}
.resumen div span{display:block;color:var(--tinta-suave);font-size:13px;margin-bottom:2px}
.resumen div strong{font-size:22px;font-weight:600;letter-spacing:-.02em}
.hueco{display:flex;gap:16px;align-items:baseline;padding:13px 0;border-top:1px solid var(--linea)}
.hueco .q{flex:1;min-width:0}
.hueco .n{color:var(--tinta-suave);font-size:14px;white-space:nowrap}

/* ---------- Pedidos ---------- */
#pedidos{display:none;max-width:720px}
#pedidos h1{font-size:22px;letter-spacing:-.02em;margin-bottom:6px}
#pedidos .intro{color:var(--tinta-suave);margin-bottom:24px}
.pedido{
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  padding:14px 0;border-top:1px solid var(--linea);
}
.pedido .de{flex:1;min-width:220px}
.pedido .de strong{font-weight:600}
.pedido .de span{display:block;color:var(--tinta-suave);font-size:14px;margin-top:2px}
.pedido .si{font-weight:600;text-decoration:underline}
.pedido .no{color:var(--tinta-suave);text-decoration:underline}

/* ---------- Detalle ----------
   El dashboard manda: ocupa el ancho completo y casi todo el
   alto de la ventana. La ficha queda debajo, al alcance de un
   scroll, para cuando hace falta chequear qué mide o quién lo
   mantiene. */
#detalle{display:none}
.acciones-detalle{display:flex;gap:18px;margin-bottom:14px}
.volver{font-weight:600;text-decoration:underline}
/* El lienzo de Power BI, Looker y Tableau es de tamaño fijo: el
   embed escala para entrar y rellena el resto con blanco. Por eso
   el marco sigue la proporción del reporte y no el alto de la
   ventana. 'alto' es para HTML propios y reportes que scrollean,
   que no tienen lienzo fijo. */
.marco{
  width:100%;
  max-width:calc((100vh - 150px) * 16 / 9);
  aspect-ratio:16 / 9;
  margin-inline:auto;
  border:1px solid var(--linea);border-radius:var(--radio);
  background:var(--tarjeta);overflow:hidden;
}
.marco[data-proporcion="4:3"]{
  aspect-ratio:4 / 3;
  max-width:calc((100vh - 150px) * 4 / 3);
}
.marco[data-proporcion="alto"]{
  aspect-ratio:auto;max-width:none;height:calc(100vh - 150px);min-height:440px;
}
.marco iframe{width:100%;height:100%;border:none;display:block}
.ficha{
  margin-top:26px;padding-top:20px;border-top:1px solid var(--linea);
  max-width:calc((100vh - 150px) * 16 / 9);margin-inline:auto;
}
.ficha h2{font-size:20px;letter-spacing:-.015em;margin-bottom:7px}
.ficha .responde{max-width:68ch;font-size:15px;margin-bottom:22px}
.datos{display:flex;flex-wrap:wrap;gap:20px 44px}
.dato{font-size:14px}
.dato span{display:block;color:var(--tinta-suave);font-size:13px;margin-bottom:2px}
</style>
</head>
<body>

<section id="ingreso">
  <div class="caja">
    <h1>Dashboards ZB</h1>
    <p data-t="login.sub"></p>
    <input class="campo" id="correo" type="email" data-tp="login.mail" autocomplete="username">
    <input class="campo" id="clave" type="password" data-tp="login.pass" autocomplete="current-password">
    <button class="principal" id="entrar" data-t="login.enter"></button>
    <p class="error" id="errorIngreso" hidden></p>
  </div>
</section>

<main id="app">
  <nav id="rail">
    <div class="marca">Dashboards ZB</div>
    <div class="contextos" id="contextos"></div>
    <button class="cargar" id="irAlta" hidden data-t="rail.alta"></button>
    <button class="cargar" id="irPedidos" hidden></button>
    <button class="cargar" id="irHuecos" hidden data-t="rail.huecos"></button>
    <div class="pie">
      <div id="quien"></div>
      <div class="idiomas">
        <button id="es" data-idioma="es">ES</button>
        <button id="pt" data-idioma="pt">PT</button>
      </div>
      <button id="salir" data-t="rail.salir"></button>
    </div>
  </nav>

  <div id="panel">
    <div id="catalogo">
      <div class="barra">
        <input id="consulta" data-tp="search.ph" aria-label="Buscar">
        <button id="buscar" data-t="search.btn"></button>
      </div>
      <div class="etiquetas" id="etiquetas"></div>
      <div class="respuesta" id="respuesta" hidden></div>
      <div class="grilla" id="grilla"></div>
    </div>

    <section id="alta">
      <h1 id="a-encabezado"></h1>
      <p class="intro" data-t="alta.intro"></p>

      <div class="fila">
        <div class="f"><label for="a-titulo" data-t="alta.titulo"></label>
          <input id="a-titulo" placeholder="Performance digital semanal"></div>
        <div class="f"><label for="a-marca" data-t="ficha.marca"></label>
          <input id="a-marca" list="marcas-lista" placeholder="Mercado Libre">
          <datalist id="marcas-lista"></datalist></div>
      </div>

      <div class="fila">
        <div class="f"><label for="a-contexto" data-t="alta.contexto"></label>
          <select id="a-contexto">
            <option value="digital">Digital</option>
            <option value="off">OFF</option>
            <option value="360">360</option>
            <option value="regional">Regional</option>
          </select>
          <div class="pista" data-t="alta.contexto.pista"></div></div>
        <div class="f"><label for="a-herramienta" data-t="alta.herramienta"></label>
          <select id="a-herramienta">
            <option value="power_bi">Power BI</option>
            <option value="tableau">Tableau</option>
            <option value="looker_studio">Looker Studio</option>
            <option value="html" data-t="alta.html"></option>
          </select></div>
        <div class="f"><label for="a-proporcion" data-t="alta.proporcion"></label>
          <select id="a-proporcion">
            <option value="16:9">16:9</option>
            <option value="4:3">4:3</option>
            <option value="alto" data-t="alta.alto"></option>
          </select>
          <div class="pista" data-t="alta.proporcion.pista"></div></div>
      </div>

      <div class="fila">
        <div class="f ancho"><label for="a-url" data-t="alta.url"></label>
          <input id="a-url" placeholder="https://..."></div>
      </div>

      <div class="fila">
        <div class="f ancho"><label for="a-responde" data-t="alta.responde"></label>
          <textarea id="a-responde" data-tp="alta.responde.ej"></textarea>
          <div class="pista" id="a-cuenta">Contá qué muestra y para qué decisión sirve.</div></div>
      </div>

      <div class="fila">
        <div class="f"><label for="a-metricas" data-t="ficha.metricas"></label>
          <input id="a-metricas" placeholder="CPM, CPC, CTR, inversión">
          <div class="pista" data-t="alta.coma"></div></div>
        <div class="f"><label for="a-granularidad" data-t="ficha.granularidad"></label>
          <input id="a-granularidad" placeholder="campaña, canal, semana">
          <div class="pista" data-t="alta.coma"></div></div>
      </div>

      <div class="fila">
        <div class="f"><label for="a-frecuencia" data-t="alta.frecuencia"></label>
          <select id="a-frecuencia">
            <option value="diaria" data-t="freq.diaria"></option>
            <option value="semanal" selected data-t="freq.semanal"></option>
            <option value="mensual" data-t="freq.mensual"></option>
            <option value="eventual" data-t="freq.eventual"></option>
          </select></div>
        <div class="f"><label for="a-responsable" data-t="ficha.responsable"></label>
          <select id="a-responsable"></select></div>
      </div>

      <div class="fila">
        <div class="f ancho"><label data-t="alta.etiquetas"></label>
          <div class="selector" id="a-tags"></div>
          <div class="pista" id="a-tags-pista" data-t="alta.etiquetas.pista"></div></div>
      </div>

      <div class="fila">
        <div class="f ancho"><label for="a-abierto" data-t="alta.quien"></label>
          <select id="a-abierto">
            <option value="si" data-t="alta.quien.si"></option>
            <option value="no" data-t="alta.quien.no"></option>
          </select>
          <div class="pista" data-t="alta.quien.pista"></div></div>
      </div>

      <div class="acciones">
        <button class="principal" id="a-guardar"></button>
        <button class="cancelar" id="a-cancelar" data-t="alta.cancelar"></button>
        <button class="cancelar" id="a-archivar" hidden data-t="alta.archivar"></button>
      </div>
      <p class="error" id="a-error" hidden></p>
    </section>

    <section id="huecos">
      <h1 data-t="rail.huecos"></h1>
      <p class="intro" data-t="huecos.intro"></p>
      <div id="resumenUso"></div>
      <div id="listaHuecos"></div>
    </section>

    <section id="pedidos">
      <h1 data-t="pedidos.titulo"></h1>
      <p class="intro" data-t="pedidos.intro"></p>
      <div id="listaPedidos"></div>
    </section>

    <div id="detalle">
      <div class="acciones-detalle">
        <button class="volver" id="volver" data-t="detalle.volver"></button>
        <button class="volver" id="irEditar" hidden data-t="detalle.editar"></button>
      </div>
      <div class="marco"><iframe id="embed" title="Dashboard"></iframe></div>
      <section class="ficha" id="ficha"></section>
    </div>
  </div>
</main>

let idioma = (navigator.language || 'es').toLowerCase().startsWith('pt') ? 'pt' : 'es';

function t(clave, vars){
  let s = TEXTOS[idioma][clave] ?? TEXTOS.es[clave] ?? clave;
  if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
  return s;
}

function aplicarIdioma(){
  document.documentElement.lang = idioma;
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll('[data-tp]').forEach(e => e.placeholder = t(e.dataset.tp));
  for (const b of document.querySelectorAll('.idiomas button'))
    b.setAttribute('aria-pressed', String(b.dataset.idioma === idioma));
  $('irPedidos').textContent = t('rail.pedidos');
  if (sesion){ contarPedidos().catch(() => {}); pintarContextos(); pintarGrilla(); }
}

for (const b of document.querySelectorAll('.idiomas button')){
  b.onclick = async () => {
    idioma = b.dataset.idioma;
    aplicarIdioma();
    if (sesion) await db.from('perfiles')
      .update({ idioma }).eq('id', sesion.user.id);
  };
}

const CONTEXTOS = [
  ['todos','Todos'], ['digital','Digital'], ['off','OFF'],
  ['360','360'], ['regional','Regional']
];
const FRESCURA = f => t('fres.' + f);

let sesion = null, fichas = [], ctxActivo = 'todos', tagsActivos = new Set();
let esAdmin = false;

const $ = id => document.getElementById(id);

/* ---------- Ingreso ---------- */
$('entrar').onclick = async () => {
  const boton = $('entrar'), err = $('errorIngreso');
  boton.disabled = true; err.hidden = true;
  const { data, error } = await db.auth.signInWithPassword({
    email: $('correo').value.trim(),
    password: $('clave').value
  });
  boton.disabled = false;
  if (error) {
    err.textContent = t('login.err');
    err.hidden = false;
    return;
  }
  sesion = data.session;
  abrir();
};
$('clave').addEventListener('keydown', e => { if (e.key === 'Enter') $('entrar').click(); });

$('salir').onclick = async () => { await db.auth.signOut(); location.reload(); };

async function abrir(){
  $('ingreso').style.display = 'none';
  $('app').style.display = 'grid';
  $('quien').textContent = sesion.user.email;

  const { data: yo } = await db.from('perfiles')
    .select('puede_cargar,admin,idioma').eq('id', sesion.user.id).single();
  if (yo?.idioma) idioma = yo.idioma;
  aplicarIdioma();
  if (yo?.puede_cargar) $('irAlta').hidden = false;
  esAdmin = !!yo?.admin;
  if (esAdmin){
    $('irPedidos').hidden = false;
    $('irHuecos').hidden = false;
    contarPedidos();
  }

  pintarContextos();
  await cargar();
}

/* ---------- Datos ---------- */
async function cargar(){
  const { data, error } = await db.from('catalogo').select('*').order('titulo');
  if (error) { console.error(error); return; }
  fichas = data;
  pintarContextos();
  pintarEtiquetas();
  pintarGrilla();
}

function visibles(){
  return fichas.filter(f =>
    (ctxActivo === 'todos' || f.contexto === ctxActivo) &&
    (tagsActivos.size === 0 || (f.tags || []).some(t => tagsActivos.has(t)))
  );
}

/* ---------- Navegación por contexto ---------- */
function pintarContextos(){
  $('contextos').innerHTML = '';
  for (const [valor, nombre] of CONTEXTOS){
    const n = valor === 'todos' ? fichas.length
                                : fichas.filter(f => f.contexto === valor).length;
    const b = document.createElement('button');
    b.className = 'ctx';
    b.setAttribute('aria-current', String(valor === ctxActivo));
    b.innerHTML = `${valor === 'todos' ? t('ctx.todos') : nombre}<span class="cuenta">${n}</span>`;
    b.onclick = () => {
      ctxActivo = valor; tagsActivos.clear();
      soloVer('catalogo');
      pintarContextos(); pintarEtiquetas(); pintarGrilla();
    };
    $('contextos').appendChild(b);
  }
}

/* ---------- Filtro manual por tags ---------- */
function pintarEtiquetas(){
  const pool = fichas.filter(f => ctxActivo === 'todos' || f.contexto === ctxActivo);
  const todos = [...new Set(pool.flatMap(f => f.tags || []))].sort();
  $('etiquetas').innerHTML = '';
  for (const t of todos){
    const b = document.createElement('button');
    b.className = 'etiqueta';
    b.textContent = t;
    b.setAttribute('aria-pressed', String(tagsActivos.has(t)));
    b.onclick = () => {
      tagsActivos.has(t) ? tagsActivos.delete(t) : tagsActivos.add(t);
      pintarEtiquetas(); pintarGrilla();
    };
    $('etiquetas').appendChild(b);
  }
}

/* ---------- Grilla ---------- */
function pintarGrilla(lista){
  const items = lista || visibles();
  const g = $('grilla');
  g.innerHTML = '';

  if (!items.length){
    g.innerHTML = `<div class="vacio">
      <strong>${t('grid.vacio')}</strong>${t('grid.vacio.sub')}
    </div>`;
    return;
  }

  for (const f of items){
    const t = document.createElement('button');
    t.className = 'tarjeta' + (f.con_acceso ? '' : ' sin-acceso');
    t.innerHTML = `
      <div class="pulso ${f.frescura}"></div>
      <div class="cuerpo">
        <div class="titulo">${esc(f.titulo)}</div>
        <div class="responde">${esc(f.que_responde)}</div>
        <div class="meta">
          <span class="estado ${f.frescura}">${FRESCURA(f.frescura)}</span>
          <span>${desde(f.ultimo_refresco)}</span>
          ${(f.tags||[]).map(x => `<span class="tag">${esc(x)}</span>`).join('')}
        </div>
        ${f.con_acceso ? '' : `<div class="pedir">${t('card.pedir')}</div>`}
      </div>`;
    t.onclick = () => f.con_acceso ? verDashboard(f) : pedirAcceso(f);
    g.appendChild(t);
  }
}

/* ---------- Lo que buscan y no existe ----------
   La otra mitad del buscador. Una búsqueda sin resultados no es
   un fallo: es un pedido de reporte que nadie levantó. Acá se
   acumulan para decidir qué construir con evidencia en vez de
   con intuición.
-------------------------------------------------------------- */
$('irHuecos').onclick = async () => {
  soloVer('huecos');
  $('resumenUso').innerHTML = '';
  $('listaHuecos').innerHTML = `<p class="intro">${t('cargando')}</p>`;

  const [{ data: u }, { data: h }] = await Promise.all([
    db.from('uso').select('*').single(),
    db.from('huecos').select('*').limit(50)
  ]);

  if (u){
    const tasa = u.busquedas
      ? Math.round(100 * (u.busquedas - u.sin_resultado) / u.busquedas)
      : 0;
    $('resumenUso').innerHTML = `
      <div class="resumen">
        <div><span>${t('huecos.busquedas')}</span><strong>${u.busquedas}</strong></div>
        <div><span>${t('huecos.tasa')}</span><strong>${tasa}%</strong></div>
        <div><span>${t('huecos.personas')}</span><strong>${u.personas}</strong></div>
        <div><span>${t('huecos.30')}</span><strong>${u.ultimos_30}</strong></div>
      </div>`;
  }

  const caja = $('listaHuecos');
  if (!h?.length){
    caja.innerHTML = `<div class="vacio"><strong>${t('huecos.vacio')}</strong>${t('huecos.vacio.sub')}</div>`;
    return;
  }

  caja.innerHTML = '';
  for (const x of h){
    const fila = document.createElement('div');
    fila.className = 'hueco';
    const veces = x.veces === 1 ? t('huecos.vez') : t('huecos.veces', { n: x.veces });
    const gente = x.personas === 1 ? t('huecos.persona') : t('huecos.gente', { n: x.personas });
    fila.innerHTML = `<div class="q">${esc(x.busqueda)}</div>
                      <div class="n">${veces} · ${gente} · ${desde(x.ultima)}</div>`;
    caja.appendChild(fila);
  }
};

/* ---------- Pedidos de acceso ----------
   Sin correo: el admin los ve al entrar. Notificar por mail
   exige un servicio de envío y un secreto más; se suma cuando
   haya volumen que lo justifique.
-------------------------------------------------------------- */
function soloVer(id){
  for (const s of ['catalogo','alta','pedidos','huecos','detalle'])
    $(s).style.display = s === id ? 'block' : 'none';
}

async function contarPedidos(){
  const { count } = await db.from('pedidos')
    .select('id', { count: 'exact', head: true });
  $('irPedidos').textContent = count
    ? `${t('rail.pedidos')} (${count})`
    : t('rail.pedidos');
}

$('irPedidos').onclick = async () => {
  soloVer('pedidos');
  const caja = $('listaPedidos');
  caja.innerHTML = `<p class="intro">${t('cargando')}</p>`;

  const { data, error } = await db.from('pedidos').select('*');
  if (error){ caja.innerHTML = '<p class="intro">No se pudieron leer los pedidos.</p>'; return; }

  if (!data.length){
    caja.innerHTML = `<div class="vacio"><strong>${t('pedidos.vacio')}</strong>${t('pedidos.vacio.sub')}</div>`;
    return;
  }

  caja.innerHTML = '';
  for (const p of data){
    const fila = document.createElement('div');
    fila.className = 'pedido';
    fila.innerHTML = `
      <div class="de">
        <strong>${esc(p.solicitante_nombre || p.solicitante)}</strong>
        <span>${esc(p.dashboard)} · ${esc(p.contexto)}</span>
      </div>`;

    const si = document.createElement('button');
    si.className = 'si'; si.textContent = t('pedidos.si');
    si.onclick = () => resolver('aprobar_solicitud', p.id, fila);

    const no = document.createElement('button');
    no.className = 'no'; no.textContent = t('pedidos.no');
    no.onclick = () => resolver('rechazar_solicitud', p.id, fila);

    fila.append(si, no);
    caja.appendChild(fila);
  }
};

async function resolver(fn, id, fila){
  const { error } = await db.rpc(fn, { s: id });
  if (error){ alert(t('alta.error') + error.message); return; }
  fila.remove();
  await contarPedidos();
  await cargar();
}

/* ---------- Alta ----------
   El formulario del Data Hub nunca preguntaba qué mide el
   reporte, y por eso hoy nada se puede recomendar. Los campos
   de la ficha son obligatorios acá: sin ellos el buscador no
   tiene con qué trabajar.
-------------------------------------------------------------- */
const MIN_RESPONDE = 40;

let editandoId = null;        // null = alta, uuid = edición
let etiquetas = [];           // vocabulario cerrado
const tagsElegidos = new Set();

async function pintarSelectorTags(){
  const { data } = await db.from('etiquetas').select('slug,nombre').order('nombre');
  etiquetas = data || [];
  const caja = $('a-tags');
  caja.innerHTML = '';

  for (const e of etiquetas){
    const b = document.createElement('button');
    b.className = 'op';
    b.textContent = e.nombre;
    b.setAttribute('aria-pressed', String(tagsElegidos.has(e.slug)));
    b.onclick = () => {
      tagsElegidos.has(e.slug) ? tagsElegidos.delete(e.slug) : tagsElegidos.add(e.slug);
      b.setAttribute('aria-pressed', String(tagsElegidos.has(e.slug)));
    };
    caja.appendChild(b);
  }

  // Ampliar el vocabulario es una decisión de admin. Si pudiera
  // cualquiera, volvemos al campo libre con pasos de más.
  if (esAdmin){
    const n = document.createElement('button');
    n.className = 'op nueva';
    n.textContent = t('alta.etiquetas.nueva');
    n.onclick = async () => {
      const nombre = prompt(t('alta.etiquetas.prompt'));
      if (!nombre?.trim()) return;
      const slug = nombre.trim().toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      if (!slug) return;
      const { error } = await db.from('etiquetas')
        .insert({ slug, nombre: nombre.trim() });
      if (error && !error.message.includes('duplicate')){
        alert(t('alta.error') + error.message); return;
      }
      tagsElegidos.add(slug);
      await pintarSelectorTags();
    };
    caja.appendChild(n);
  }
}

    .join('');

}

  const { data: d, error } = await db.from('dashboards')
    .select('*').eq('id', id).single();
  if (error){ alert(t('alta.error') + error.message); return; }

  editandoId = id;
  await abrirFormulario();

  const { data: m } = d.marca_id
    ? await db.from('marcas').select('nombre').eq('id', d.marca_id).single()
    : { data: null };

  $('a-encabezado').textContent = t('alta.editar');
  $('a-guardar').textContent = t('alta.guardar.editar');
  $('a-archivar').hidden = false;

  $('a-titulo').value       = d.titulo;
  $('a-marca').value        = m?.nombre ?? '';
  $('a-contexto').value     = d.contexto;
  $('a-herramienta').value  = d.herramienta;
  $('a-proporcion').value   = d.proporcion;
  $('a-url').value          = d.url;
  $('a-responde').value     = d.que_responde;
  $('a-metricas').value     = (d.metricas || []).join(', ');
  $('a-granularidad').value = (d.granularidad || []).join(', ');
  tagsElegidos.clear();
  (d.tags || []).forEach(t => tagsElegidos.add(t));
  await pintarSelectorTags();
  $('a-frecuencia').value   = d.frecuencia;
  $('a-abierto').value      = d.abierto_interno ? 'si' : 'no';
  if (d.responsable_id) $('a-responsable').value = d.responsable_id;
  $('a-responde').dispatchEvent(new Event('input'));
};

$('a-archivar').onclick = async () => {
  if (!editandoId) return;
  if (!confirm(t('alta.archivar.confirmar'))) return;
  const { error } = await db.from('dashboards')
    .update({ activo: false }).eq('id', editandoId);
  if (error){ alert(t('alta.error') + error.message); return; }
  editandoId = null;
  cerrarAlta();
  await cargar();
};

function limpiarFormulario(){
  ['a-titulo','a-url','a-responde','a-metricas','a-granularidad','a-marca']
    .forEach(id => $(id).value = '');
  tagsElegidos.clear();
  pintarSelectorTags();
  $('a-abierto').value = 'si';
  $('a-responde').dispatchEvent(new Event('input'));
}

$('a-cancelar').onclick = cerrarAlta;
function cerrarAlta(){
  soloVer('catalogo');
  $('a-error').hidden = true;
}

$('a-responde').addEventListener('input', e => {
  const n = e.target.value.trim().length;
  const p = $('a-cuenta');
  if (n === 0){
    p.className = 'pista';
    p.textContent = t('alta.responde.pista');
  } else if (n < MIN_RESPONDE){
    p.className = 'pista corto';
    p.textContent = t('alta.responde.falta', { n: MIN_RESPONDE - n });
  } else {
    p.className = 'pista';
    p.textContent = t('alta.responde.ok');
  }
});

const lista = id => $(id).value.split(',').map(s => s.trim()).filter(Boolean);

$('a-guardar').onclick = async () => {
  const err = $('a-error');
  const boton = $('a-guardar');
  err.hidden = true;

  const titulo   = $('a-titulo').value.trim();
  const url      = $('a-url').value.trim();
  const responde = $('a-responde').value.trim();

  if (!titulo || !url || responde.length < MIN_RESPONDE){
    err.textContent = t('alta.falta');
    err.hidden = false;
    return;
  }

  boton.disabled = true;

  // La marca se crea sola si es nueva.
  let marca_id = null;
  const marca = $('a-marca').value.trim();
  if (marca){
    const { data: existente } = await db.from('marcas')
      .select('id').eq('nombre', marca).maybeSingle();
    if (existente) marca_id = existente.id;
    else {
      const { data: nueva } = await db.from('marcas')
        .insert({ nombre: marca }).select('id').single();
      marca_id = nueva?.id ?? null;
    }
  }

  const ficha = {
    titulo,
    contexto:     $('a-contexto').value,
    herramienta:  $('a-herramienta').value,
    proporcion:   $('a-proporcion').value,
    url,
    marca_id,
    que_responde: responde,
    metricas:     lista('a-metricas'),
    granularidad: lista('a-granularidad'),
    tags:         [...tagsElegidos],
    frecuencia:   $('a-frecuencia').value,
    responsable_id: $('a-responsable').value || null,
    abierto_interno: $('a-abierto').value === 'si',
    refresco_origen: 'manual'
  };

  const { error } = editandoId
    ? await db.from('dashboards').update(ficha).eq('id', editandoId)
    : await db.from('dashboards').insert(ficha);

  boton.disabled = false;

  if (error){
    err.textContent = t('alta.error') + error.message;
    err.hidden = false;
    return;
  }

  editandoId = null;
  limpiarFormulario();
  cerrarAlta();
  await cargar();
};

/* ---------- Búsqueda ----------
   La pregunta va a la Edge Function, que consulta a Claude con
   las fichas que este usuario puede ver. El resultado filtra la
   misma grilla: no es una pantalla aparte ni un chat.
-------------------------------------------------------------- */
$('buscar').onclick = buscar;
$('consulta').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });

async function buscar(){
  const texto = $('consulta').value.trim();
  const caja = $('respuesta');

  if (!texto){ caja.hidden = true; pintarGrilla(); return; }

  caja.hidden = false;
  caja.className = 'respuesta pensando';
  caja.textContent = t('search.pensando');

  const { data, error } = await db.functions.invoke('buscar', {
    body: { consulta: texto, contexto: ctxActivo }
  });

  if (error || data?.error){
    // Si la función no está desplegada todavía, el buscador sigue
    // sirviendo por texto en vez de dejar la pantalla muerta.
    const r = porTexto(texto);
    caja.className = 'respuesta pensando';
    caja.textContent = `${t('search.texto')}: ${r.length} ${t(r.length === 1 ? 'search.reporte' : 'search.reportes')}.`;
    pintarGrilla(r);
    return;
  }

  const encontrados = data.ids
    .map(id => fichas.find(f => f.id === id))
    .filter(Boolean);

  caja.className = 'respuesta';
  caja.textContent = data.mensaje || '';

  if (!encontrados.length){
    const b = document.createElement('button');
    b.textContent = t('search.pedir');
    b.onclick = () => {
      caja.textContent = t('search.pedido');
    };
    caja.appendChild(b);
  }

  pintarGrilla(encontrados);
}

function porTexto(q){
  const s = q.toLowerCase();
  return visibles().filter(f =>
    (f.titulo + ' ' + f.que_responde + ' ' +
     (f.metricas||[]).join(' ') + ' ' + (f.tags||[]).join(' ')
    ).toLowerCase().includes(s)
  );
}

/* ---------- Utilidades ---------- */
function esc(s){
  return String(s ?? '').replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function desde(iso){
  if (!iso) return t('fecha.sin');
  const dias = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if (dias <= 0) return t('fecha.hoy');
  if (dias === 1) return t('fecha.ayer');
  return t('fecha.hace', { n: dias });
}

/* ---------- Sesión existente ---------- */
aplicarIdioma();
const { data: { session } } = await db.auth.getSession();
if (session) { sesion = session; abrir(); }
</script>
